<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <div class="container py-5 position-relative">
        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error:</strong> {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}

        <div class="d-flex justify-content-end mb-3">
            <form method="POST" action="/logout">
                <button type="submit" class="btn btn-danger">Logout</button>
            </form>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card bg-secondary text-white shadow rounded-4 p-4">
                    <h2 class="mb-3">Hello, {{ username }}!</h2>
                    <h4 class="mb-4">Balance: ${{ balance }}
                        <span class="text-white-50" data-bs-toggle="tooltip"
                              title="Money you are not playing with right now. What you buy in with is held at the table and comes back here when you get up. The balance may take a few minutes to return to its full amount.">&#9432;</span>
                    </h4>

                    <form method="POST" action="/play">
                        <label for="buy_in" class="form-label">Buy in</label>
                        <div class="input-group input-group-lg mb-2">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" id="buy_in" name="buy_in"
                                   step="1" min="1" max="{{ balance }}" value="{{ balance }}"
                                   required>
                        </div>

                        <div class="btn-group w-100 mb-3" role="group" aria-label="Quick buy in amounts">
                            <button type="button" class="btn btn-outline-light btn-sm" data-fraction="0.25">25%</button>
                            <button type="button" class="btn btn-outline-light btn-sm" data-fraction="0.5">50%</button>
                            <button type="button" class="btn btn-outline-light btn-sm" data-fraction="1">Max</button>
                        </div>

                        <p class="small text-white-50">
                            This much leaves your balance while you are at the table, and comes
                            back with whatever is left of it when you get up.
                        </p>

                        <button type="submit" class="btn btn-success btn-lg w-100">Play</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));

        (function () {
            const field = document.getElementById('buy_in');
            const balance = parseFloat(field.max);
            document.querySelectorAll('[data-fraction]').forEach(function (button) {
                button.addEventListener('click', function () {
                    const amount = Math.floor(balance * parseFloat(button.dataset.fraction));
                    field.value = String(amount);
                });
            });
        })();
    </script>
</body>

</html>
