services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackjack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "blackjack"]
      interval: 2s
      retries: 15

  central_1:
    build: .
    restart: unless-stopped
    command: poetry run central
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blackjack
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy

  central_2:
    build: .
    restart: unless-stopped
    command: poetry run central
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blackjack
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy

  central_lb:
    image: nginx:1.28
    ports:
      - "5002:5002"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - central_1
      - central_2

  game_server_1:
    build: .
    restart: unless-stopped
    command: poetry run game_server
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      SERVER_HOST: "127.0.0.1"
      SERVER_PORT: "8000"
      CENTRAL_URLS: "http://central_1:5002,http://central_2:5002"
      CENTRAL_PUBLIC_URL: "http://localhost:5002"
    depends_on:
      - central_1
      - central_2

  game_server_2:
    build: .
    restart: unless-stopped
    command: poetry run game_server
    env_file: .env
    ports:
      - "8001:8001"
    environment:
      SERVER_HOST: "127.0.0.1"
      SERVER_PORT: "8001"
      CENTRAL_URLS: "http://central_1:5002,http://central_2:5002"
      CENTRAL_PUBLIC_URL: "http://localhost:5002"
    depends_on:
      - central_1
      - central_2

volumes:
  postgres_data: