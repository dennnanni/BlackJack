# Single entry point of the browsers to the central replicas.
# The game servers do not pass through here: they know the replicas directly.
events {}

http {
    # Docker DNS: a replica that restarts may come back with another address
    resolver 127.0.0.11 valid=5s;

    upstream central {
        zone central 64k;
        # A replica that fails is left out for fail_timeout, then tried again
        server central_1:5002 resolve max_fails=1 fail_timeout=10s;
        server central_2:5002 resolve max_fails=1 fail_timeout=10s;
    }

    server {
        listen 5002;

        location / {
            proxy_pass http://central;
            # Keep host and port, so the redirects of central point back here
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # A request is moved to the other replica only if this one never
            # received it. nginx does not resend a POST that already reached a
            # replica: /play is not idempotent and must not run twice.
            proxy_next_upstream error timeout;
            proxy_connect_timeout 2s;
        }
    }
}
