# Two networks so a *partial* partition can be demonstrated:
#   internal — game servers <-> central (+ central <-> postgres)
#   frontend — browser-facing side of the game servers (published ports;
#              listed first so host traffic NATs through it)
# `docker network disconnect blackjack_internal blackjack-game_server_1-1`
# severs only the server<->central link; players keep playing over frontend.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackjack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  central:
    build: .
    command: poetry run central
    ports:
      - "16000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blackjack
      # Pinned so a restart does not invalidate every session cookie and log
      # all the players out. Override it for anything but a demo.
      SECRET_KEY: ${SECRET_KEY:-blackjack-demo-session-key}
      PYTHONUNBUFFERED: "1"
    env_file: .env
    networks:
      - internal
    depends_on:
      - postgres

  game_server_1:
    build: .
    command: poetry run game_server
    ports:
      - "8001:8001"
    environment:
      SERVER_HOST: localhost   # address the browser uses to reach this server
      SERVER_PORT: "8001"
      CENTRAL_URL: http://central:5000
      CENTRAL_PUBLIC_URL: http://localhost:16000   # where "leave table" sends the browser
      SECRET_KEY: ${SECRET_KEY:-blackjack-demo-session-key}
      OUTBOX_PATH: /data/outbox.db
      PYTHONUNBUFFERED: "1"
    env_file: .env
    volumes:
      - gs1_outbox:/data       # outbox survives container restarts
    networks:
      - frontend
      - internal
    depends_on:
      - central

  game_server_2:
    build: .
    command: poetry run game_server
    ports:
      - "8002:8002"
    environment:
      SERVER_HOST: localhost
      SERVER_PORT: "8002"
      CENTRAL_URL: http://central:5000
      CENTRAL_PUBLIC_URL: http://localhost:16000   # where "leave table" sends the browser
      SECRET_KEY: ${SECRET_KEY:-blackjack-demo-session-key}
      OUTBOX_PATH: /data/outbox.db
      PYTHONUNBUFFERED: "1"
    env_file: .env
    volumes:
      - gs2_outbox:/data
    networks:
      - frontend
      - internal
    depends_on:
      - central

networks:
  internal:
  frontend:

volumes:
  postgres_data:
  gs1_outbox:
  gs2_outbox:
