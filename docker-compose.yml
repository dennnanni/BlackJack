services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackjack
    volumes:
      - postgres_data:/var/lib/postgresql/data

  servers_interface:
    build: .
    command: poetry run servers
    ports:
      - "16001:5002"
    environment:
      - SERVER_PORT=16001
      - DATABASE_URL=http://database_interface:5001
    volumes:
      - ./:/var/www

  database_interface:
    build: .
    command: poetry run database
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blackjack
    depends_on:
      - postgres
    volumes:
      - ./:/var/www

  client_interface:
    build: .
    command: poetry run client
    ports:
      - "16000:5000"
    environment:
      - CLIENT_PORT=16000
      - DATABASE_URL=http://database_interface:5001
    volumes:
      - ./:/var/www

  game_server_1:
    build: .
    command: poetry run game_server
    ports:
      - "5000:8001"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8001"
      CENTRAL_SERVER_URL: "http://servers_interface:5002"

volumes:
  postgres_data:
