services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackjack
    volumes:
      - postgres_data:/var/lib/postgresql/data

  central:
    build: .
    command: poetry run central
    ports:
      - "16000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/blackjack
      PYTHONUNBUFFERED: "1"
    env_file: .env
    depends_on:
      - postgres

  game_server_1:
    build: .
    command: poetry run game_server
    ports:
      - "8001:8001"
    environment:
      SERVER_HOST: localhost   # address the browser uses to reach this server
      SERVER_PORT: "8001"
      CENTRAL_URL: http://central:5000
      PYTHONUNBUFFERED: "1"
    env_file: .env
    depends_on:
      - central

  game_server_2:
    build: .
    command: poetry run game_server
    ports:
      - "8002:8002"
    environment:
      SERVER_HOST: localhost
      SERVER_PORT: "8002"
      CENTRAL_URL: http://central:5000
      PYTHONUNBUFFERED: "1"
    env_file: .env
    depends_on:
      - central

volumes:
  postgres_data:
