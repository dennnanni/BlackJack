services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackjack
    volumes:
      - postgres_data:/var/lib/postgresql/data

  central:
    build: .
    command: poetry run central
    ports:
      - "5002:5002"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blackjack
      - SECRET_KEY=${SECRET_KEY:-blackjack-demo-session-key}
      - PYTHONBUFFERED=1
    env_file: .env
    depends_on:
      - postgres

  game_server_1:
    build: .
    command: poetry run game_server
    ports:
      - "8000:8000"
    environment:
      SERVER_HOST: "127.0.0.1"
      SERVER_PORT: "8000"
      CENTRAL_URL: "http://central:5002"
      CENTRAL_PUBLIC_URL: "http://localhost:5002"   # where "leave table" sends the browser
      # Temporary
      HEARTBEAT_INTERVAL: "3600"
      LEASE_TIMEOUT: "86400"
    env_file: .env
    depends_on:
      - central

volumes:
  postgres_data:
