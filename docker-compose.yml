services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackjack
    volumes:
      - postgres_data:/var/lib/postgresql/data

  servers_interface:
    build: .
    command: poetry run servers
    ports:
      - "16001:5002"
    environment:
      - SERVER_PORT=16001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blackjack
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/var/www
    depends_on:
      - postgres

  client_interface:
    build: .
    command: poetry run client
    ports:
      - "16000:5000"
    environment:
      - CLIENT_PORT=16000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blackjack
    volumes:
      - ./:/var/www
    depends_on:
      - postgres

  game_server_1:
    build: .
    command: poetry run game_server
    ports:
      - "8000:8000"
    environment:
      SERVER_HOST: "127.0.0.1"
      SERVER_PORT: "8000"
      CENTRAL_SERVER_URL: "http://servers_interface:5002"
      
  

volumes:
  postgres_data:
